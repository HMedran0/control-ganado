name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, pruebas y build
    runs-on: ubuntu-latest
    # Un paso colgado no debe ocupar el runner las 6 horas por defecto.
    timeout-minutes: 30

    # PostgreSQL real para las pruebas de integración (04-arquitectura.md §9, §10).
    # Misma imagen que docker-compose.yml.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hato
          POSTGRES_PASSWORD: hato_dev
          POSTGRES_DB: hato_test
          TZ: America/Bogota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hato -d hato_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # La base de las pruebas de integración; el arranque de la suite le aplica las
      # migraciones. El puerto lo fija el servicio de arriba, nunca el código.
      DATABASE_URL: postgresql://hato:hato_dev@localhost:5432/hato_test?schema=public
      TEST_DATABASE_URL: postgresql://hato:hato_dev@localhost:5432/hato_test?schema=public
      APP_TIMEZONE: America/Bogota
      TURBO_TELEMETRY_DISABLED: "1"
      # Secretos de prueba: no sirven en ningún entorno real.
      JWT_ACCESS_SECRET: secreto-de-integracion-continua-1234567890ab
      REFRESH_TOKEN_PEPPER: pepper-de-integracion-continua-1234567890abcd
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_WEB_URL: http://localhost:5173
      # Contraseña de los usuarios de demostración del seed. De prueba: no sirve en ningún
      # entorno real.
      SEED_PASSWORD: seed-de-integracion-continua

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --strict-peer-dependencies: una advertencia de peer dependencies falla la build.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      # El cliente de Prisma no se versiona: se genera desde el esquema.
      - name: Generar el cliente de Prisma
        run: pnpm db:generate

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Incluye las pruebas de integración de la API contra el PostgreSQL del servicio.
      - name: Pruebas
        run: pnpm test

      # ADR-002: las fechas de negocio no deben depender de la zona horaria del proceso.
      # PGTZ: los clientes de PostgreSQL abren en la hora de Bogotá, como el contenedor local. La
      # base de pruebas también la tiene por defecto (global-setup); la API debe seguir en UTC y
      # conservar la hora exacta de las marcas de tiempo (test/timestamps.e2e-spec.ts, error de M5).
      - name: Pruebas en dos zonas horarias
        env:
          PGTZ: America/Bogota
        run: pnpm test:tz

      # Las pruebas importan el seed como módulo, así que no pasan por el gancho de
      # resolución de ADR-006. Este paso ejecuta el comando de verdad para que ese camino
      # no se rompa sin que nadie se entere. La suite deja el esquema aplicado en hato_test.
      - name: Seed de la finca de referencia
        run: pnpm db:seed

      # RNF-01: 5.000 animales y 50.000 eventos en una finca aparte, y las pruebas de
      # rendimiento de búsqueda y listado sobre ella. En la integración continua solo reportan
      # los tiempos (resumen del job y anotaciones): el runner compartido no es el servidor de
      # la finca. El umbral se aplica al correrlas en local.
      - name: Seed de carga
        run: pnpm db:seed:load

      - name: Rendimiento (RNF-01)
        run: pnpm --filter @hato/api test:perf

      - name: Build
        run: pnpm build

      # RNF-02: la carga inicial de la web (JS + CSS que pide index.html, en gzip) no pasa del
      # tope de apps/web/package.json (hato.initialLoadBudgetKb). Detecta saltos; subir el tope
      # se justifica en el mensaje del commit.
      - name: Tamaño de la carga inicial de la web
        run: pnpm --filter @hato/web size

      # Pruebas de extremo a extremo (M2): la web compilada con `vite preview` y la API
      # compilada, contra hato_test ya sembrada por el paso «Seed». Playwright levanta los dos
      # servidores; la web llega a la API por el proxy de /api (ADR-008).
      - name: Cachear los navegadores de Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar Chromium para Playwright
        run: pnpm --filter @hato/web exec playwright install --with-deps chromium

      # Diagnóstico visible como anotación (los logs del job exigen permisos de administrador):
      # cómo resuelve el runner «localhost», que usan el proxy de Vite y Playwright.
      - name: Diagnóstico de red para las pruebas de extremo a extremo
        run: echo "::notice title=localhost::$(getent ahosts localhost | awk '{print $1}' | sort -u | paste -sd ' ')"

      - name: Pruebas de extremo a extremo
        timeout-minutes: 10
        run: pnpm --filter @hato/web test:e2e

      # Las capturas se publican siempre, no solo si algo falla: son parte de la revisión
      # visual de cada cambio.
      - name: Publicar capturas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: capturas-web
          path: apps/web/e2e/capturas/
          if-no-files-found: warn

      - name: Publicar el reporte de Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reporte-playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
